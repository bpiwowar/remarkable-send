name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Package
        run: npx web-ext build --overwrite-dest --filename 'remarkable-send-{version}.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: web-ext-artifacts/*.zip
